<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1f2747"/>
      <stop offset="100%" stop-color="#2f3a7a"/>
    </linearGradient>
  </defs>
  <!-- abstract backdrop circle -->
  <circle cx="540" cy="220" r="160" fill="#8e93ff" opacity="0.25"/>
  <!-- notes board -->
  <rect x="480" y="110" width="240" height="180" rx="16" fill="#eaeefe" stroke="#8e93ff" stroke-width="4"/>
  <rect x="510" y="140" width="90" height="28" rx="8" fill="#8e93ff"/>
  <rect x="510" y="176" width="170" height="14" rx="7" fill="#8e93ff" opacity="0.8"/>
  <rect x="510" y="200" width="140" height="14" rx="7" fill="#8e93ff" opacity="0.8"/>
  <rect x="510" y="224" width="110" height="14" rx="7" fill="#8e93ff" opacity="0.8"/>
  <!-- big notebook -->
  <rect x="120" y="160" width="340" height="260" rx="18" fill="#fff3cd" stroke="#ffcc00" stroke-width="6"/>
  <path d="M160 220 h260 M160 260 h210 M160 300 h160" stroke="#2f3a7a" stroke-width="8" stroke-linecap="round"/>
  <!-- books base -->
  <rect x="100" y="440" width="520" height="70" rx="10" fill="#3b4d99"/>
  <rect x="130" y="515" width="220" height="40" rx="8" fill="#2f3a7a"/>
  <rect x="370" y="515" width="220" height="40" rx="8" fill="#2f3a7a"/>
  <!-- pins -->
  <circle cx="500" cy="120" r="10" fill="#8e93ff"/>
  <circle cx="700" cy="120" r="10" fill="#8e93ff"/>
</svg>
